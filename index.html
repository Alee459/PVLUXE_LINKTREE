<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iván Darío Quiroga | COO Colombia - LATAM</title>
  <meta name="description" content="Iván Darío Quiroga, COO Colombia - LATAM en PVLUXE y VMA New Energy.">
  <link rel="icon" href="imagenes/logo_vma_tarjeta_digital.jpg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #edf6ff;
      background:
        linear-gradient(rgba(2, 11, 20, 0.48), rgba(2, 11, 20, 0.62)),
        url("imagenes/fondo_linktree.jpg") center / cover no-repeat fixed;
    }

    .tarjeta {
      width: min(100%, 440px);
      padding: 28px 24px 24px;
      border: 1px solid rgba(190, 218, 255, 0.5);
      border-radius: 24px;
      background: rgba(10, 28, 46, 0.82);
      box-shadow: 0 18px 40px rgba(13, 35, 57, 0.4);
      backdrop-filter: blur(8px);
    }

    .encabezado {
      margin-bottom: 24px;
      text-align: center;
    }

    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .logo {
      width: 104px;
      height: 104px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .separador {
      width: 3px;
      height: 76px;
      border-radius: 3px;
      background: #78b8ff;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .cargo {
      margin-top: 8px;
      color: #cfe0f9;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
    }

    .redes {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .redes img {
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .enlaces {
      display: grid;
      gap: 12px;
    }

    .boton {
      display: block;
      padding: 15px 16px;
      border: 1px solid rgba(135, 183, 255, 0.7);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(13, 45, 73, 0.96), rgba(7, 25, 42, 0.96));
      box-shadow: 0 8px 18px rgba(28, 99, 201, 0.18);
      color: #edf6ff;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .boton:hover,
    .boton:focus-visible {
      transform: translateY(-2px);
      border-color: #90c4ff;
      box-shadow: 0 0 0 2px rgba(93, 167, 255, 0.32), 0 12px 24px rgba(75, 151, 255, 0.42);
    }

    .boton:active {
      transform: translateY(0);
    }

    @media (max-width: 380px) {
      .tarjeta { padding: 24px 18px 20px; }
      .logo { width: 88px; height: 88px; }
      h1 { font-size: 1.55rem; }
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <header class="encabezado">
      <div class="logos" aria-label="Logos de PVLUXE y VMA New Energy">
        <div class="logo">
          <img src="imagenes/logo_pvluxe_tarjeta_digital.jpg" alt="Logo PVLUXE">
        </div>
        <div class="separador" aria-hidden="true"></div>
        <div class="logo">
          <img src="imagenes/logo_vma_tarjeta_digital.jpg" alt="Logo VMA New Energy">
        </div>
      </div>
      <h1>Iván Darío Quiroga</h1>
      <p class="cargo">COO Colombia - LATAM</p>
      <div class="redes" aria-label="Redes sociales">
        <img src="imagenes/whatsapp_logo_tarjeta_digital.png" alt="WhatsApp">
        <img src="imagenes/linkedin_logo_tarjeta_digital.png" alt="LinkedIn">
      </div>
    </header>

    <nav class="enlaces" aria-label="Enlaces principales">
      <a class="boton" href="mailto:iquirogalopez@vma-energy.com?subject=Contacto%20profesional" target="_blank" rel="noopener noreferrer">Contacto profesional</a>
      <a class="boton" href="mailto:iquirogalopez@hotmail.com?subject=Alianzas%20y%20negocios" target="_blank" rel="noopener noreferrer">Alianzas y negocios</a>
      <a class="boton" href="https://wa.me/qr/YRDOFQCIFV3CL1" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a class="boton" href="https://www.linkedin.com/in/ivan-dario-quiroga-31570857/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a class="boton" href="https://asblr.com/lOeCZJQ" target="_blank" rel="noopener noreferrer">Modelado Digital: Energía Solar</a>
    </nav>
  </main>
</body>
</html>
